name: merge-iptv-rules

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai. GitHub may start the run later than the exact minute.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge upstream rule lists
        run: python scripts/merge_rules.py
      - name: Commit when the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv_merged.yaml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: merge iptv rule lists"
            git push
          fi
